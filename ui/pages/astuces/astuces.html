<link rel="stylesheet" href="{{ @BASE }}/assets/css/astuces.css"/>
<set hero_title="Toutes nos Astuces ✨" />
<set hero_subtitle="Explorez nos conseils pour maîtriser les subtilités du français." />
<include href="partials/hero.html" />

<a href="/" class="back-link"><span>←</span> Retour au tableau de bord</a>


<header class="astuces-header">
    <div class="favoris-btn-container">
        <a href="/mes-favoris" class="btn-outline">
            Voir mes astuces favorites ❤️
        </a>
        <check if="{{ @canEdit }}">
            <a href="/astuces/add" class="btn-primary btn-add-astuce">
                + Ajouter une astuce
            </a>
        </check>
    </div>
</header>

<div class="tips-grid">
    <repeat group="{{ @astuces }}" value="{{ @astuce }}">
        <article class="tip-card">
            <div class="tip-content">
                <h3>{{ @astuce.titre }}</h3>
                <p>{{ @astuce.description }}</p>
                <check if="{{ @canEdit }}">
                    <a class="tip-edit-link" href="/astuces/edit/{{ @astuce.id }}">✏️ Modifier</a>
                </check>
            </div>
            <div class="tip-actions">
                <button class="btn-favori {{ @astuce.is_favori ? 'active' : '' }}" onclick="toggleFavori({{ @astuce.id }}, this)" title="{{ @astuce.is_favori ? 'Retirer des favoris' : 'Ajouter aux favoris' }}">
                    <svg class="heart-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 17.5 3 20.58 3 23 5.42 23 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                </button>
            </div>
        </article>
    </repeat>
</div>

<script>
    const IS_CONNECTED = {{ isset(@SESSION.user_id) ? 'true' : 'false' }};
    const CSRF_TOKEN = '{{ @csrfToken }}';

    function toggleFavori(id, btn) {
        // Vérification de la connexion
        if (!IS_CONNECTED) {
            window.location.href = '/login';
            return;
        }
        // Ajoute une classe pour l'animation
        btn.classList.add('popping');

        fetch('/favori/toggle/' + id, {
            method: 'POST',
            headers: {
                'X-CSRF-Token': CSRF_TOKEN
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (data.action === 'added') {
                    btn.classList.add('active');
                    btn.title = "Retirer des favoris";
                } else {
                    btn.classList.remove('active');
                    btn.title = "Ajouter aux favoris";
                }
            } else {
                if (data.error === 'AUTH_REQUIRED') {
                    window.location.href = '/login';
                } else {
                    alert(data.message || 'Une erreur est survenue.');
                }
            }
        })
        .catch(error => console.error('Erreur:', error))
        .finally(() => {
            setTimeout(() => {
                btn.classList.remove('popping');
            }, 400);
        });
    }
</script>
