<link rel="stylesheet" href="{{ @BASE }}/assets/css/profile.css"/>
<div class="profile-container">
 <div class="profile-header"><div class="avatar">{{ substr(@client.prenom, 0, 1) }}{{ substr(@client.nom, 0, 1) }}</div><div class="user-info"><h2>{{ @client.prenom }} {{ @client.nom }}</h2><p>{{ @client.email }}</p></div></div>
 <h3>Ma Progression</h3><div class="stats-grid"><div class="stat-card"><span class="stat-number">{{ @SESSION.consecutive_days }}</span><span class="stat-label">Jours consécutifs</span></div><div class="stat-card"><span class="stat-number">{{ @score }}</span><span class="stat-label">Score Test Initial</span></div><div class="stat-card"><span class="stat-number">{{ @niveau }}</span><span class="stat-label">Niveau Actuel</span></div></div>
 <div class="action-buttons"><a href="/profile/edit" class="btn btn-edit">Modifier mes infos</a><a href="/logout" class="btn btn-logout">Se déconnecter</a></div>
</div>
