<!-- Utilisation du partial Hero pour la page de la mini-grammaire -->
<set hero_title="Codes de Correction 📝" />
<set hero_subtitle="Cliquez sur un code pour voir ses règles et exemples." />
<include href="partials/hero.html" />

<!-- Inclusion du CSS spécifique -->
<link rel="stylesheet" href="{{ @BASE }}/assets/css/mini_grammaire.css"/>

<div style="margin:10px">

    <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput"
               placeholder="Rechercher un code (ex: G1, P10)..."
               oninput="searchFunction()">
    </div>

    <div id="noResults">Aucun résultat trouvé 🔍</div>

    <div class="codes-grid" id="grid" style="margin-top:20px;">

        <repeat group="{{ @categories }}" value="{{ @category }}">
            <div class="code-category-card" data-cat="{{ @category.letter }}">
                <div class="card-header {{ @category.letter }}">{{ @category.name }} ({{ strtoupper(@category.letter) }})</div>
                <div class="card-body">

                    <repeat group="{{ @category.codes }}" value="{{ @code }}">
                        <a class="code-chip badge-{{ @category.letter }}"
                           data-code="{{ @code }}"
                           href="{{ @BASE }}/mini_grammaire/{{ @code }}">
                            <span class="code-chip-code">{{ @code }}</span>
                            <span class="code-chip-category">{{ @category.name }}</span>
                        </a>
                    </repeat>

                </div>
            </div>
        </repeat>

    </div>

</div>

<script src="{{ @BASE }}/assets/js/script_search.js"></script>
